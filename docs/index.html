<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Зонд мини-приложения</title>
    <!--
      Страница-зонд, а не будущий мини-апп. Её задача — один раз пройти всю
      цепочку живьём: диплинк → клиент MAX → initData → наша проверка подписи.
      Пока это не сделано, проектировать конкурсный экран рано: мы не знаем,
      что именно платформа кладёт в данные запуска.

      Бэкенда сознательно нет: initData показывается на экране и копируется в
      буфер, а подпись проверяется локально. Это избавляет от необходимости
      выставлять API наружу ради одной проверки.
    -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #16181d;
        --muted: #6b7280;
        --line: #e5e7eb;
        --card: #f6f7f9;
        --ok: #0f7a3d;
        --bad: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101215;
          --fg: #e8eaed;
          --muted: #9aa1ab;
          --line: #262a31;
          --card: #181b20;
          --ok: #4ade80;
          --bad: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px 16px 48px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      h1 { font-size: 19px; margin: 0 0 4px; }
      p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
      section {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 12px;
        background: var(--card);
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 8px;
        font-weight: 600;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-all;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
      dt { color: var(--muted); font-size: 13px; }
      dd { margin: 0; font-size: 13px; word-break: break-all; }
      button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: var(--fg);
        color: var(--bg);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .empty { color: var(--muted); font-style: italic; }
    </style>
  </head>
  <body>
    <h1>Зонд мини-приложения</h1>
    <p class="sub">Показывает, что клиент MAX передал странице при запуске.</p>

    <section>
      <h2>Окружение</h2>
      <dl id="env"></dl>
    </section>

    <section>
      <h2>Пользователь и чат</h2>
      <dl id="who"></dl>
    </section>

    <section>
      <h2>start_param из диплинка</h2>
      <pre id="startParam"></pre>
    </section>

    <section>
      <h2>initData (подписанная строка)</h2>
      <pre id="initData"></pre>
    </section>

    <button id="copy">Скопировать initData</button>

    <script>
      (function () {
        var app = window.WebApp;
        var raw = (app && app.initData) || '';
        var unsafe = (app && app.initDataUnsafe) || {};
        var preview = false;

        // Вне MAX библиотека Bridge не отдаёт данных запуска, и страница
        // выглядит пустой — посмотреть, что увидит человек, невозможно.
        // Поэтому если объекта WebApp нет, разбираем фрагмент адреса сами:
        // MAX кладёт данные ровно туда (`#WebAppData=...`), так что тот же
        // разбор годится и для предпросмотра, и для отладки реального
        // запуска. Подпись здесь не проверяется — это делает сервер.
        if (!raw && window.location.hash) {
          var hash = window.location.hash.slice(1);
          var fragment = new URLSearchParams(hash);
          var fromUrl = fragment.get('WebAppData');
          // `#preview` — образец данных, чтобы посмотреть страницу глазами
          // пользователя, не имея доступа к MAX.
          if (!fromUrl && (hash === 'preview' || fragment.has('preview'))) {
            fromUrl = samplePayload();
          }
          if (fromUrl) {
            raw = fromUrl;
            preview = !app;
            unsafe = parseLaunchParams(fromUrl);
          }
        }

        function samplePayload() {
          var sample = {
            auth_date: String(Math.floor(Date.now() / 1000)),
            chat: JSON.stringify({ id: -79114405995998, type: 'CHANNEL' }),
            query_id: '00000000-0000-4000-8000-000000000000',
            start_param: 'proba_1',
            user: JSON.stringify({
              id: 263973086,
              first_name: 'Иван',
              last_name: 'Петренко',
              username: null,
              language_code: 'ru',
            }),
            hash: 'образец, настоящая подпись сюда не попадает',
          };
          return Object.keys(sample)
            .map(function (k) { return k + '=' + encodeURIComponent(sample[k]); })
            .join('&');
        }

        function parseLaunchParams(value) {
          var out = {};
          value.split('&').forEach(function (pair) {
            var at = pair.indexOf('=');
            if (at === -1) return;
            var key = pair.slice(0, at);
            var text = decodeURIComponent(pair.slice(at + 1));
            if (key === 'user' || key === 'chat') {
              try { out[key] = JSON.parse(text); } catch (e) { out[key] = text; }
            } else {
              out[key] = text;
            }
          });
          return out;
        }

        function put(id, rows) {
          var dl = document.getElementById(id);
          dl.innerHTML = '';
          rows.forEach(function (row) {
            var dt = document.createElement('dt');
            dt.textContent = row[0];
            var dd = document.createElement('dd');
            var value = row[1];
            if (value === undefined || value === null || value === '') {
              dd.textContent = 'нет';
              dd.className = 'empty';
            } else {
              dd.textContent = String(value);
            }
            dl.append(dt, dd);
          });
        }

        put('env', [
          ['Bridge загружен', app ? 'да' : 'НЕТ'],
          ['Режим', preview ? 'предпросмотр из адреса' : 'запуск из MAX'],
          ['platform', app && app.platform],
          ['version', app && app.version],
          ['deviceName', app && app.deviceName],
        ]);

        if (preview) {
          var note = document.createElement('p');
          note.className = 'sub';
          note.textContent =
            'Предпросмотр: данные взяты из адреса, а не от клиента MAX. ' +
            'Подпись не проверена — так выглядит страница, а не настоящий запуск.';
          document.querySelector('h1').after(note);
        }

        var user = unsafe.user || {};
        var chat = unsafe.chat || {};
        put('who', [
          ['user.id', user.id],
          ['first_name', user.first_name],
          ['last_name', user.last_name],
          ['username', user.username],
          ['language_code', user.language_code],
          ['chat.id', chat.id],
          ['chat.type', chat.type],
          ['query_id', unsafe.query_id],
          ['auth_date', unsafe.auth_date],
        ]);

        var startParam = document.getElementById('startParam');
        if (unsafe.start_param) {
          startParam.textContent = unsafe.start_param;
          startParam.className = 'ok';
        } else {
          startParam.textContent = 'пусто — приложение открыто не по диплинку';
          startParam.className = 'empty';
        }

        var initData = document.getElementById('initData');
        if (raw) {
          initData.textContent = raw;
        } else {
          initData.textContent =
            'пусто — страница открыта вне MAX и без данных в адресе';
          initData.className = 'bad';
        }

        document.getElementById('copy').addEventListener('click', function () {
          var button = this;
          // Буфер обмена в вебвью может быть недоступен, поэтому запасной
          // путь — выделить текст, чтобы его можно было скопировать руками.
          function done(text) {
            button.textContent = text;
            setTimeout(function () {
              button.textContent = 'Скопировать initData';
            }, 2000);
          }
          if (navigator.clipboard && raw) {
            navigator.clipboard.writeText(raw).then(
              function () { done('Скопировано'); },
              function () { select(); }
            );
          } else {
            select();
          }
          function select() {
            var range = document.createRange();
            range.selectNodeContents(initData);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            done('Выделено — скопируйте вручную');
          }
        });
      })();
    </script>
  </body>
</html>
