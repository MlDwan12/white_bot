<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Политика конфиденциальности</title>
    <!--
      Заглушка: адрес нужен уже сейчас (на него ссылается экран согласия в
      MAX-боте), а текста политики пока нет. Меняется только содержимое
      <div id="content"> — заголовок, стиль и баннер-предупреждение трогать
      не нужно.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #16181d;
        --muted: #6b7280;
        --line: #e5e7eb;
        --warn-bg: #fef2db;
        --warn-fg: #714900;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101215;
          --fg: #e8eaed;
          --muted: #9aa1ab;
          --line: #262a31;
          --warn-bg: #3a2f10;
          --warn-fg: #f4d79b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px 16px 48px;
        max-width: 640px;
        margin-inline: auto;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      h1 { font-size: 20px; margin: 0 0 16px; }
      .warn {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 20px;
        background: var(--warn-bg);
        color: var(--warn-fg);
        font-size: 14px;
      }
      p { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="warn">
      Черновик. Здесь будет действующая политика конфиденциальности — сейчас
      страница только держит адрес.
    </div>
    <h1>Политика конфиденциальности</h1>
    <div id="content">
      <p>Текст политики конфиденциальности появится здесь.</p>
    </div>
  </body>
</html>
