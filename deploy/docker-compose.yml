# Прод-стек на сервере (/opt/white_bot). Образ приложения собирается на
# машине разработки и доставляется `docker save | docker load` — см. README,
# раздел «Деплой». Наружу открыты только 80/443 (Caddy); postgres, redis и
# само приложение портов не публикуют.
services:
  app:
    image: white-bot:${APP_TAG}
    restart: unless-stopped
    init: true
    env_file: .env
    # Том монтируется в каталог, который в образе уже создан и принадлежит
    # `node` (uid 1000): пустой именованный том при первом монтировании
    # наследует владельца из образа. В несуществующий путь (/data/media)
    # том пришёл бы root-овым, и первая загрузка упала бы с EACCES.
    volumes:
      - media:/app/storage/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: white_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: white_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U white_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Отложенные задачи очереди должны переживать перезапуск Redis.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  media:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
